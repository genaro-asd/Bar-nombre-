<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar El Refugio - Reserva </title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">🍺 Bar El Refugio</div>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="menu.html">Carta</a></li>
        <li><a href="contacto.html" class="active">Reservar </a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Reservá </h2>
      <p style="text-align: center; margin-bottom: 1.5rem; color: #ccc;">Completá el formulario para asegurar tu lugar en nuestra barra o salón.</p>
    <form id="formContacto" novalidate>
        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre">
          <span class="error-message" id="errorNombre"></span>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email">
          <span class="error-message" id="errorEmail"></span>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono de Contacto:</label>
          <input type="tel" id="telefono" name="telefono">
          <span class="error-message" id="errorTelefono"></span>
        </div>

        <div class="form-group">
          <label for="mensaje">Detalle de la reserva (Cantidad de personas, fecha y hora):</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Ej: Mesa para 4 personas el viernes 24 a las 21:30 hs en el patio..."></textarea>
          <span class="error-message" id="errorMensaje"></span>
        </div>

        <button type="submit">Confirmar Reserva</button>
      </form>

      <div id="contenedorResumen"></div>
    
    
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Bar El Refugio - Trabajo Final Integrador</p>
  </footer>
</body>
</html>
